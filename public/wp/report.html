        const RiskBreakdown = ({ reportData }) => { const [explainersOpen, setExplainersOpen] = useState(false); const toggleExplainers = () => setExplainersOpen(prev => !prev); return ( <Card> <h2 className="text-center" style={{marginTop: 0}}>What We Examined</h2> <div className="risk-breakdown-grid"> <div className="risk-breakdown-item"> <div className="icon">🌪️</div><h4>Storm Risk</h4> <div className="value">{reportData.distanceToCoast} miles</div> <div className="label">From The Coast</div> <RoofStatus roofAge={reportData.unlockData.roofAge} /> <div className="risk-item-footer"> <p className="value-statement">&ldquo;After Hurricane Irma, roughly one in three claims went unpaid or underpaid. Most of those families believed they were covered.&rdquo;</p> <Source text="Property Insurance Coverage Law Blog" /> </div> <Explainer title="How this is calculated" isOpen={explainersOpen} onToggle={toggleExplainers}> <p>Your Storm Score is a combination of geographic and property-specific factors:</p> <ul> <li><b>Geographic Risk:</b> Your score increases based on proximity to the coastline (up to a 50pt penalty).</li> <li><b>Property Vulnerabilities (Penalties):</b> Older roofs (11+ years) and the absence of impact windows add significant points to your score.</li> <li><b>Property Strengths (Major Bonuses):</b> A new roof (0&ndash;5 years) and having impact windows provide major credits, significantly lowering your score to reflect a much safer home.</li> </ul> </Explainer> </div> <div className="risk-breakdown-item"> <div className="icon">🏠</div><h4>Burglary Risk</h4> <div className="value">{reportData.fbiData.latestCount}</div> <div className="label">Annual Burglaries ({reportData.fbiData.source})</div> <div className="roof-status" style={{ visibility: 'hidden' }} aria-hidden="true">&nbsp;</div> <div className="risk-item-footer"> <p className="value-statement">&ldquo;Most intruders test glass first. If it gives in ten seconds, the house is open.&rdquo;</p> <Source text="2024 FBI UCR Program Data" /> </div> <Explainer title="How this is calculated" isOpen={explainersOpen} onToggle={toggleExplainers}> <p>Your Burglary Score is based on the 5-year trend for your area, anchored by official 2024 data. A score is calculated based on whether recent burglaries are trending up or down compared to the 5-year average.</p> </Explainer> </div> </div> <p className="text-center" style={{marginTop: '24px', maxWidth: 'none'}}>These numbers are the symptoms. Your private briefing covers the causes &mdash; including the policy details most homeowners never read.</p> </Card> ); };
        const FinancialOpportunities = ({ financialCalcs, monthlyElectricBill, onMonthlyBillChange, homeValue }) => { const [explainersOpen, setExplainersOpen] = useState(false); const toggleExplainers = () => setExplainersOpen(prev => !prev); return ( <Card> <h2 className="text-center" style={{marginTop: 0}}>The Other Side of the Ledger</h2> <div className="opportunities-grid"> <div className="opportunity-item"> <div className="icon">💰</div><h4>Insurance Savings</h4> <div className="value">{fmtUSD(financialCalcs.insuranceSavings)}</div> <div className="label">Provided under Chapter 627</div> <div className="explainer"> <Explainer title="How this is calculated" isOpen={explainersOpen} onToggle={toggleExplainers}> <p>Based on estimated premiums for your home's value, we project a <b>20% wind mitigation credit</b> on the windstorm portion (est. 60%) of your premium over 10 years.</p> <Source text="Florida Statute 627.0629" /> </Explainer> </div> </div> <div className="opportunity-item"> <div className="icon">📈</div><h4>Home Equity Boost</h4> <div className="value">{fmtUSD(financialCalcs.homeValueIncrease)}</div> <div className="label">Based on Resale Value</div> <div className="explainer"> <Explainer title="How this is calculated" isOpen={explainersOpen} onToggle={toggleExplainers}> <p>Based on the 2025 Cost vs. Value report, upgrades like impact windows and doors provide a strong return on investment. We estimate a potential home equity boost of ~7.4% of your home's current value.</p> <p>Your Estimated Boost: <b>{fmtUSD(homeValue)} (Home Value) x 7.4% = {fmtUSD(financialCalcs.homeValueIncrease)}</b></p> <Source text="2025 Cost vs. Value Report (Miami, FL data)" /> </Explainer> </div> </div> <div className="opportunity-item"> <div className="icon">⚡️</div><h4>Energy Savings</h4> <div className="value">{fmtUSD(financialCalcs.energySavings)}</div> <div className="label">Dept. of Energy estimates</div> <div className="interactive-calculator"> <label htmlFor="electric-bill-slider">Your Avg. Electric Bill: <b>{fmtUSD(monthlyElectricBill)}</b></label> <input id="electric-bill-slider" type="range" min="50" max="500" step="5" value={monthlyElectricBill} onChange={(e) => onMonthlyBillChange(Number(e.target.value))} /> </div> <div className="explainer"> <Explainer title="How this is calculated" isOpen={explainersOpen} onToggle={toggleExplainers}> <p>Based on a <b>15% energy reduction</b> from new impact windows, projected over 10 years with an estimated 5% annual energy cost inflation.</p> <Source text="U.S. Dept. of Energy & EIA data" /> </Explainer> </div> </div> </div> <p className="text-center" style={{marginTop: '24px', maxWidth: 'none'}}><strong>Why this matters:</strong> Florida law (Chapter 627) requires insurers to discount premiums when homeowners add hurricane-resistant protection like impact windows. Most families never claim those credits.</p> </Card> ); };
        const InsuranceCheck = ({ dwellingCoverage, onDwellingCoverageChange, source }) => { const deductibleLow = dwellingCoverage * 0.02; const deductibleHigh = dwellingCoverage * 0.10; return ( <Card style={{ borderColor: '#f4d1d1', background: '#fffafa' }}> <h3 style={{ marginTop: 0, textAlign: 'center' }}>The Deductible Math</h3> <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '24px', alignItems: 'center', marginBottom: '24px', textAlign: 'center' }}> <div> <div className="interactive-calculator insurance-calc"> <label htmlFor="dwelling-coverage-slider">Dwelling Coverage (A): <b>{dwellingCoverage >= 5000000 ? `${fmtUSD(dwellingCoverage)}+` : fmtUSD(dwellingCoverage)}</b></label> <input id="dwelling-coverage-slider" type="range" min="100000" max="5000000" step="10000" value={dwellingCoverage} onChange={e => onDwellingCoverageChange(Number(e.target.value))} /> <Source text={source} /> </div> </div> <div> <div style={{ fontSize: '18px', fontWeight: 700, color: 'var(--red)' }}>Hurricane Deductible (2%&ndash;10%)</div> <div className="text-danger" style={{ fontSize: '36px', fontWeight: 900, margin: '4px 0' }}>{fmtUSD(deductibleLow)} &ndash; {fmtUSD(deductibleHigh)}</div> </div> </div> <p className="text-center value-statement" style={{maxWidth: '650px', margin: '0 auto', minHeight: 0}}>&ldquo;A hurricane deductible is a percentage of your coverage, not a flat fee. On this home, that&rsquo;s the range above &mdash; out of pocket, before insurance pays a dollar.&rdquo;</p> <Explainer title="How this is calculated"> <p>The Hurricane Deductible is typically a percentage (from 2% to 10%) of your home's Dwelling Coverage amount, not a fixed dollar value like other deductibles. As your home's value increases, your out-of-pocket cost for a hurricane claim also rises significantly.</p> </Explainer> </Card> ); };
        const TwoPaths = () => <Card> <h3 className="text-center" style={{ marginTop: 0 }}>Two Paths Forward</h3> <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '20px' }}> <div style={{ background: '#f5fff5', border: '1px solid #c8e6c9', borderRadius: '12px', padding: '20px' }}> <h4>Documented Protection</h4> <p><span className="text-success" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✔</span>Qualify for wind mitigation credits, backed by Florida law</p> <p><span className="text-success" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✔</span>Stronger storm and burglary resistance at the openings</p> <p><span className="text-success" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✔</span>Higher property value, lower bills</p> </div> <div style={{ background: '#fff5f5', border: '1px solid #ffcdd2', borderRadius: '12px', padding: '20px' }}> <h4>Insurance &amp; Hope</h4> <p><span className="text-danger" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✘</span>The deductible comes out of your pocket first</p> <p><span className="text-danger" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✘</span>Claims can be denied or paid in part</p> <p><span className="text-danger" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✘</span>Premiums reprice every year</p> <p><span className="text-danger" style={{ fontWeight: 900, marginRight: '8px', fontSize: '1.2em' }}>✘</span>The weakest point stays where it is</p> </div> </div> <p className='text-center' style={{marginTop: '20px', maxWidth: 'none'}}>One path is documented. The other is hoped for.</p> </Card>;
        const NextStep = ({ dwellingCoverage, monthlyElectricBill, verdict, grade }) => {
            const handleNext = () => {
                const currentParams = new URLSearchParams(window.location.search);
                currentParams.set('coverage', dwellingCoverage);
                currentParams.set('avg_bill', monthlyElectricBill);

                const nextUrl = new URL(NEXT_STEP_URL);
                currentParams.forEach((value, key) => {
                    nextUrl.searchParams.append(key, value);
                });

                if (window.WP_EMIT) window.WP_EMIT('cta_click', { target: NEXT_STEP_URL, grade: grade, weakest_point: verdict ? verdict.key : '' });
                window.location.href = nextUrl.toString();
            };
            return ( <Card className="text-center" style={{ padding: 0 }}> <div style={{ padding: '24px 24px 0' }}> <h2>The Next Step</h2> <p>The numbers tell you where your home is exposed. Your private briefing shows what to do about it &mdash; and what Florida law already entitles you to.</p> <ul style={{textAlign: 'left', display: 'inline-block', listStylePosition: 'inside', paddingLeft: 0, marginBottom: '1.5rem'}}> <li>The exposures behind your scores, explained plainly.</li> <li>The deductible and credit math on a home like yours.</li> <li>What a documented protection plan looks like &mdash; before the season, not after.</li> </ul> <div> <button onClick={handleNext} className="button final-cta-button">Watch Your Private Briefing &rarr;</button> </div> <p className="small muted" style={{marginTop: '12px'}}>Still no phone call. Still no home visit. Your report stays yours either way.</p> </div> <div style={{ marginTop: '2.5rem', background: 'var(--cream)', padding: '24px', borderBottomLeftRadius: '14px', borderBottomRightRadius: '14px', borderTop: '1px solid #e0d0b0' }}> <h3 style={{ fontSize: '24px', color: 'var(--navy)', marginTop: 0 }}>A Note on Timing</h3> <p style={{textAlign: 'left', maxWidth: '650px', margin: '1rem auto' }}>Hurricane season runs June through November &mdash; it doesn&rsquo;t move. Premiums reprice once a year, and they have not been moving down. And the credits in this report apply once protection is installed and inspected &mdash; not after a storm.</p> <p style={{textAlign: 'left', maxWidth: '650px', margin: '1rem auto 0', fontWeight: 'bold' }}>None of that urgency comes from us. The calendar provides its own.</p> </div> </Card> );
        };
        const Report = ({ reportData, monthlyElectricBill, dwellingCoverage, onMonthlyBillChange, onDwellingCoverageChange }) => ( <div className="report-context" style={{ width: '100%', maxWidth: '960px', padding: '20px' }}> <ReportHeader address={reportData.addressData.address} /> <WeakestPointVerdict verdict={reportData.weakestPoint} /> <ReportSummary reportData={reportData} totalCost={reportData.totalOpportunityCost} financialCalcs={reportData.financialCalcs} /> <RiskBreakdown reportData={reportData} /> <FinancialOpportunities financialCalcs={reportData.financialCalcs} monthlyElectricBill={monthlyElectricBill} onMonthlyBillChange={onMonthlyBillChange} homeValue={dwellingCoverage} /> <InsuranceCheck dwellingCoverage={dwellingCoverage} onDwellingCoverageChange={onDwellingCoverageChange} source={reportData.homeValue.source} /> <TwoPaths /> <NextStep dwellingCoverage={dwellingCoverage} monthlyElectricBill={monthlyElectricBill} verdict={reportData.weakestPoint} grade={getLetterFromScore(reportData.overallScore)} /> </div> );

        const App = () => {
            const [reportData, setReportData] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [monthlyElectricBill, setMonthlyElectricBill] = useState(170);
            const [dwellingCoverage, setDwellingCoverage] = useState(0);
            const webhookDebounceTimeout = useRef(null);

            const postToWebhook = useCallback((data, currentCoverage, currentBill) => {
                if (!data || !data.addressData || !data.unlockData) return;

                clearTimeout(webhookDebounceTimeout.current);
                webhookDebounceTimeout.current = setTimeout(() => {
                    // Shareable static report URL lives on this same Railway domain.
                    const baseUrl = window.location.origin + '/report';

                    const reportParams = new URLSearchParams();
                    const essentialData = { ...data.addressData, email: data.unlockData.email, phone: data.unlockData.phone, roof_age: data.unlockData.roofAge, impact_windows_installed: data.unlockData.hasImpactWindows, coverage: currentCoverage, avg_bill: currentBill };
                    for (const [key, value] of Object.entries(essentialData)) {
                        if (value != null && value !== '') { reportParams.append(key, value); }
                    }
                    const reportUrl = `${baseUrl}?${reportParams.toString()}`;

                    const currentUrlParams = new URLSearchParams(window.location.search);
                    const payload = {
                        email: String(data.unlockData.email || ""), phone: String(data.unlockData.phone || ""),
                        address1: String(data.addressData.address1 || data.addressData.address), city: String(data.addressData.city || ""),
                        state: String(data.addressData.state || ""), postal_code: String(data.addressData.postal_code || ""),
                        dwelling_coverage: String(currentCoverage), average_electric_bill: String(currentBill),
                        total_opportunity_cost: String(Math.round(data.totalOpportunityCost)), roof_age: String(data.unlockData.roofAge || ""),
                        impact_windows: String(data.unlockData.hasImpactWindows || ""), overall_score: String(getLetterFromScore(data.overallScore)),
                        storm_score: String(data.stormScore.toFixed(0)), burglary_score: String(data.burglaryScore.toFixed(0)),
                        distance_to_coast: String(data.distanceToCoast),
                        weakest_point: String(data.weakestPoint ? data.weakestPoint.label : ""),
                        utm_source: String(currentUrlParams.get('utm_source') || ''), utm_medium: String(currentUrlParams.get('utm_medium') || ''),
                        utm_campaign: String(currentUrlParams.get('utm_campaign') || ''), utm_term: String(currentUrlParams.get('utm_term') || ''),
                        utm_content: String(currentUrlParams.get('utm_content') || ''),
                        report_url: reportUrl
                    };

                    fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                    .then(response => { if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`); return response.text(); })
                    .then(data => console.log('Webhook submission successful.'))
                    .catch(error => console.error('Error submitting to webhook:', error));
                }, 1000);
            }, []);

            useEffect(() => {
                const generateReport = async () => {
                    const urlParams = new URLSearchParams(window.location.search);

                    const addressData = { address: urlParams.get('address') || '', address1: urlParams.get('address1') || '', city: urlParams.get('city') || '', state: urlParams.get('state') || '', postal_code: urlParams.get('postal_code') || '', county: urlParams.get('county') || '', lat: parseFloat(urlParams.get('lat')) || 0, lng: parseFloat(urlParams.get('lng')) || 0, };
                    const unlockData = { email: urlParams.get('email') || '', phone: urlParams.get('phone') || '', roofAge: urlParams.get('roof_age') || '', hasImpactWindows: urlParams.get('impact_windows_installed') || 'No' };

                    if (!addressData.address || !unlockData.email || !addressData.lat) { console.error("Missing critical data in URL, redirecting."); window.location.href = ADDRESS_PAGE_URL; return; }

                    try {
                        let homeValueResult;
                        const coverageValueFromUrl = urlParams.get('coverage');
                        const avgBillFromUrl = urlParams.get('avg_bill');
                        let isStaticLoad = false;

                        if (coverageValueFromUrl && !isNaN(parseInt(coverageValueFromUrl, 10))) {
                            isStaticLoad = true; setIsLoading(false);
                            homeValueResult = { value: parseInt(coverageValueFromUrl, 10), source: 'Pre-Calculated' };
                        } else {
                            setIsLoading(true);
                            homeValueResult = await fetchPropertyValueFromProxy(addressData.address);
                        }

                        const initialDwellingCoverage = homeValueResult.value;
                        const initialMonthlyBill = !isNaN(parseInt(avgBillFromUrl, 10)) ? parseInt(avgBillFromUrl, 10) : 170;

                        setDwellingCoverage(initialDwellingCoverage);
                        setMonthlyElectricBill(initialMonthlyBill);

                        const fbiData = await fetchFBICrimeData(addressData.city, addressData.county);
                        const distanceToCoast = calculateDistanceToCoast(addressData.lat, addressData.lng);
                        const sanitizedRoofAge = (unlockData.roofAge || '').replace('+', ' ').replace(' years', '').replace('–', '-').trim();
                        // '20' alias covers '20+' after '+'-stripping sanitization above.
                        const roofAgeMap = { '0-5': -25, '6-10': 0, '11-15': 10, '16-20': 20, '20+': 35, '20': 35 };
                        let stormScore = 0;
                        if (distanceToCoast < 50) stormScore += 50 - distanceToCoast;
                        if (unlockData.hasImpactWindows === 'No') stormScore += 30; else stormScore -= 35;
                        stormScore += roofAgeMap[sanitizedRoofAge] || 0;
                        stormScore = clamp(stormScore, 0, 100);

                        const avgCrime = fbiData.rows.reduce((acc, row) => acc + row.count, 0) / fbiData.rows.length;
                        const recentCrime = fbiData.latestCount;
                        let burglaryScore = 50 + ((recentCrime - avgCrime) / (avgCrime || 1)) * 50;
                        burglaryScore = clamp(burglaryScore, 0, 100);

                        const overallScore = stormScore * 0.65 + burglaryScore * 0.35;

                        const insuranceSavings = (initialDwellingCoverage * 0.02 * 0.60 * 0.20) * 10;
                        const energySavings = calculateInteractiveEnergySavings(initialMonthlyBill);
                        const homeValueIncrease = initialDwellingCoverage * 0.074;
                        const totalOpportunityCost = insuranceSavings + energySavings + homeValueIncrease;

                        const weakestPoint = computeWeakestPoint({ distanceToCoast, hasImpactWindows: unlockData.hasImpactWindows, sanitizedRoofAge, burglaryScore });

                        const finalReportData = { addressData, unlockData, distanceToCoast, stormScore, burglaryScore, overallScore, fbiData, homeValue: homeValueResult, financialCalcs: { insuranceSavings, energySavings, homeValueIncrease }, totalOpportunityCost, weakestPoint };

                        setReportData(finalReportData);
                        setIsLoading(false);

                        if (window.WP_EMIT) window.WP_EMIT('report_ready', { grade: getLetterFromScore(overallScore), weakest_point: weakestPoint.key, total_opportunity_cost: Math.round(totalOpportunityCost), static_load: isStaticLoad });

                        // Fire ReeceTrack.identify once we have email from unlockData
                        if (unlockData.email && window.ReeceTrack) {
                            window.ReeceTrack.identify({
                                email: unlockData.email,
                                phone: unlockData.phone || undefined,
                                name: addressData.address || undefined
                            });
                        }

                        if (!isStaticLoad) {
                            postToWebhook(finalReportData, initialDwellingCoverage, initialMonthlyBill);
                        }

                    } catch (e) { console.error("Failed to parse data or generate report.", e); window.location.href = ADDRESS_PAGE_URL; }
                };
                generateReport();
            }, [postToWebhook]);

            const handleMonthlyBillChange = useCallback((newBill) => {
                setMonthlyElectricBill(newBill);
                setReportData(prev => {
                    if (!prev) return null;
                    const newEnergySavings = calculateInteractiveEnergySavings(newBill);
                    const newTotal = prev.financialCalcs.insuranceSavings + newEnergySavings + prev.financialCalcs.homeValueIncrease;
                    const updatedData = { ...prev, financialCalcs: { ...prev.financialCalcs, energySavings: newEnergySavings }, totalOpportunityCost: newTotal };
                    postToWebhook(updatedData, dwellingCoverage, newBill);
                    return updatedData;
                });
            }, [dwellingCoverage, postToWebhook]);

            const handleDwellingCoverageChange = useCallback((newCoverage) => {
                setDwellingCoverage(newCoverage);
                setReportData(prev => {
                    if (!prev) return null;
                    const newInsuranceSavings = (newCoverage * 0.02 * 0.60 * 0.20) * 10;
                    const newHomeValueIncrease = newCoverage * 0.074;
                    const newTotal = newInsuranceSavings + prev.financialCalcs.energySavings + newHomeValueIncrease;
                    const updatedData = { ...prev, financialCalcs: { ...prev.financialCalcs, insuranceSavings: newInsuranceSavings, homeValueIncrease: newHomeValueIncrease }, totalOpportunityCost: newTotal };
                    postToWebhook(updatedData, newCoverage, monthlyElectricBill);
                    return updatedData;
                });
            }, [monthlyElectricBill, postToWebhook]);

            const loadingMessages = ["Examining coastal exposure…", "Estimating your home's value…", "Preparing your finding…"];

            if (isLoading) return <LoadingIndicator messages={loadingMessages} />;
            if (!reportData) return <div>Error generating report. Please <a href={ADDRESS_PAGE_URL}>start over</a>.</div>;

            return <Report reportData={reportData} monthlyElectricBill={monthlyElectricBill} dwellingCoverage={dwellingCoverage} onMonthlyBillChange={handleMonthlyBillChange} onDwellingCoverageChange={handleDwellingCoverageChange} />;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
